services:
  db:
    image: pgvector/pgvector:pg16
    container_name: plataformaemais-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma
      POSTGRES_DB: plataformaemais
    ports:
      - "5432:5432"
    volumes:
      - plataformaemais_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d plataformaemais"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plataformaemais_db_data:
