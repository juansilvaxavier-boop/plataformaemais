name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      # Valores fictícios: build/lint não abrem conexão real com o banco,
      # apenas precisam de uma URL sintaticamente válida para o Prisma Client.
      DATABASE_URL: "postgresql://user:password@localhost:5432/plataformaemais"
      AUTH_SECRET: "ci-build-secret-not-used-in-production"
      APP_BASE_URL: "http://localhost:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build
